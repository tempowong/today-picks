name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:00 10:00 13:00 16:00 19:00 22:00 HKT. No run from 23:00 to 07:00.
    - cron: "0 23 * * *"
    - cron: "0 2 * * *"
    - cron: "0 5 * * *"
    - cron: "0 8 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the open edition window
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node --experimental-strip-types scripts/fetch-board.mjs
      - name: Keep the published edition in the repo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.email "tempowong28@gmail.com"
          git config user.name "TEMPO WONG"
          git add src/generated/board.json
          git diff --cached --quiet || git commit -m "Publish the scheduled edition"
          git push
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_DATA_SOURCE: static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
